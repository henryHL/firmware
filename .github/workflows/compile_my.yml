name: Compile My Meshtastic Firmware

on:
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Ensures external dependencies and submodules load correctly

      - name: Set up Python
        uses: actions/checkout@v4
        with:
          python-version: '3.10'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Run PlatformIO Build
        run: pio run -e my-esp32s3-diy-oled

      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-esp32s3-diy-oled-firmware
          path: .pio/build/my-esp32s3-diy-oled/firmware.bin
          if-no-files-found: error
