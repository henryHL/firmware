[env:henry-s3-board]
extends = esp32s3_base
board = esp32-s3-devkitc-1-n16r8v      ; Crucial: Tells PlatformIO to configure 16MB Flash / 8MB PSRAM
board_level = extra                    ; Prevents the core build matrix from throwing warnings

build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW                         ; Informs Meshtastic this is a custom, non-production board
  -I variants/esp32s3/henry_s3_board   ; Points the compiler to your local pin definition header
  -D LORA_RXEN=4                        ; Binds hardware RF switch RX line to Pin 4 at firmware compilation
  -D LORA_TXEN=9                        ; Binds hardware RF switch TX line to Pin 9 at firmware compilation
  -D HAS_NEOPIXEL                       ; Tells Meshtastic to activate the WS2812 RGB driver
  -D PIN_NEOPIXEL=48                    ; Maps the WS2812 Data Line to GPIO 48
  -D NEOPIXEL_COUNT=1                   ; Tells the driver there is 1 single built-in RGB LED
